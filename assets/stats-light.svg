<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="160" viewBox="0 0 1280 160" role="img" aria-label="27,000+ people use apps I've built; 17 EU cloud providers researched; 4+ years building software; $10,000+ raised for charity">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .in { opacity: 0; animation: up .9s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .bar { animation: grow 1.6s cubic-bezier(.22,1,.36,1) forwards; transform: scaleX(0); transform-origin: left; }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .r { opacity: 0; } .r1 { opacity: 1; } .in { opacity: 1; } } @media (prefers-reduced-motion: reduce) { .bar { transform: none; } }
  </style>
  <defs><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset=".35" stop-color="#8b5cf6"/><stop offset=".7" stop-color="#f43f5e"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs>
  <rect x=".5" y=".5" width="1279" height="159" rx="20" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect class="bar" x="24" y="0.5" width="1232" height="3" rx="1.5" fill="url(#bar)"/>
  <g class="in" style="animation-delay:0.00s"><text x="40.0" y="86" font-size="46" font-weight="800" letter-spacing="-1" fill="#1f2328">27,000+</text><text x="40.0" y="118" font-size="16" fill="#59636e">people use apps I've built</text></g><line x1="320.0" y1="28" x2="320.0" y2="132" stroke="#d0d7de"/><g class="in" style="animation-delay:0.12s"><text x="360.0" y="86" font-size="46" font-weight="800" letter-spacing="-1" fill="#1f2328">17</text><text x="360.0" y="118" font-size="16" fill="#59636e">EU cloud providers researched</text></g><line x1="640.0" y1="28" x2="640.0" y2="132" stroke="#d0d7de"/><g class="in" style="animation-delay:0.24s"><text x="680.0" y="86" font-size="46" font-weight="800" letter-spacing="-1" fill="#1f2328">4+</text><text x="680.0" y="118" font-size="16" fill="#59636e">years building software</text></g><line x1="960.0" y1="28" x2="960.0" y2="132" stroke="#d0d7de"/><g class="in" style="animation-delay:0.36s"><text x="1000.0" y="86" font-size="46" font-weight="800" letter-spacing="-1" fill="#1f2328">$10,000+</text><text x="1000.0" y="118" font-size="16" fill="#59636e">raised for charity as a volunteer</text></g>
</svg>
