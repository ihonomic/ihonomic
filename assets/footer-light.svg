<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="120" viewBox="0 0 1280 120" role="img" aria-label="Thanks for visiting">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .wave { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 3s cubic-bezier(.22,1,.36,1) forwards, flow 14s linear 3s infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -2800; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .r { opacity: 0; } .r1 { opacity: 1; } .in { opacity: 1; } } @media (prefers-reduced-motion: reduce) { .wave { stroke-dashoffset: 0; } }
  </style>
  <defs><linearGradient id="w" x1="0" x2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset=".35" stop-color="#8b5cf6"/><stop offset=".7" stop-color="#f43f5e"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs>
  <path class="wave" d="M0 60 C 160 20, 320 100, 480 60 S 800 20, 960 60 S 1200 100, 1280 60" fill="none" stroke="url(#w)" stroke-width="3" stroke-linecap="round"/>
  <path d="M0 60 C 160 20, 320 100, 480 60 S 800 20, 960 60 S 1200 100, 1280 60" fill="none" stroke="url(#w)" stroke-width="14" stroke-linecap="round" opacity=".08"/>
</svg>
